version: 0.2 

env:
  variables:
    APP_ENV: local
    APP_NAME: codebuild-practice

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Example for INSTALL phase"
      - echo "Node.js runtime configured"

  pre_build:
    commands:
      - echo "Example for PRE_BUILD phase"

  build:
    commands:
      - echo "PRACTICE BUILDSPEC FILE:"
      - echo "Example for CodeBuild - buildspec file"
      - node --version
      - npm --version

      - echo "PRACTICE LIFECYCLE PHASES:"
      - echo "Example for BUILD phase"

      - echo "PRACTICE MULTIPLE COMMAND LINES:"
      - echo "Command 1"
      - echo "Command 2"
      - echo "Command 3"
      - echo "Command 4"

      - echo "PRACTICE RUNTIME VERSIONS:"
      - echo "Checking Node.js version"
      - node --version
      - npm --version

      - echo "PRACTICE ENV VARIABLES:"
      - echo "Application: $APP_NAME"
      - echo "Environment: $APP_ENV"

  post_build:
    commands:
      - echo "Example for POST_BUILD phase"