version: 0.2 

env:
  variables:
    APP_ENV: local
    APP_NAME: codebuild-practice

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Example for INSTALL phase"
      - echo "Node.js runtime configured"

  pre_build:
    commands:
      - echo "Example for PRE_BUILD phase"

  build:
    commands:
      - echo "PRACTICE BUILDSPEC FILE"
      - echo "Example for CodeBuild - buildspec file"
      - node --version
      - npm --version

      - echo "PRACTICE LIFECYCLE PHASES"
      - echo "Example for BUILD phase"

      - echo "PRACTICE MULTIPLE COMMAND LINES"
      - echo "Command 1"
      - echo "Command 2"
      - echo "Command 3"
      - invalid commands
      - echo "Command 4"

      - echo "PRACTICE RUNTIME VERSIONS"
      - echo "Checking Node.js version"
      - node --version
      - npm --version

      - echo "PRACTICE ENV VARIABLES"
      - echo "Application - $APP_NAME"
      - echo "Environment - $APP_ENV"

      - echo "PRACTICE CODEBUILD ENV VARIABLES:"
      - echo "Build ID - $CODEBUILD_BUILD_ID"
      - echo "Build Number - $CODEBUILD_BUILD_NUMBER"
      - echo "Source Directory - $CODEBUILD_SRC_DIR"
      - echo "Source Version - $CODEBUILD_SOURCE_VERSION"
      - echo "AWS Region - $AWS_REGION"
    
    finally:
      - echo "Finally command executed"

  post_build:
    commands:
      - echo "Example for POST_BUILD phase"